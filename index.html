<html lang="zh-HK"><head><meta charset="utf-8">

<style>
:root{color-scheme:only light}*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:-apple-system,"PingFang HK","Microsoft JhengHei",sans-serif;color:#1f2328}
#app{display:flex;height:100%}
#side{width:340px;display:flex;flex-direction:column;border-right:1px solid #ddd;background:#fafafa}
#map{flex:1}
header{padding:14px 16px 10px;border-bottom:1px solid #e5e5e5;background:#fff}
h1{font-size:17px;margin:0 0 4px}.sub{font-size:12px;color:#666}
.ctl{padding:10px 16px;border-bottom:1px solid #e5e5e5;background:#fff;display:flex;flex-direction:column;gap:8px}
input[type=search]{width:100%;padding:8px 10px;border:1px solid #ccc;border-radius:6px;font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid #ccc;background:#fff;border-radius:999px;padding:4px 10px;font-size:13px;cursor:pointer;user-select:none}
.chip.on{background:#1f2328;color:#fff;border-color:#1f2328}
.chip .dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:0}
label.tg{font-size:13px;display:flex;align-items:center;gap:6px}
#count{font-size:12px;color:#666}
#list{flex:1;overflow:auto}
.item{padding:9px 16px;border-bottom:1px solid #eee;cursor:pointer;display:flex;gap:10px;align-items:flex-start}
.item:hover{background:#f0f0f0}
.item .dot{width:10px;height:10px;border-radius:50%;margin-top:5px;flex:none}
.item b{font-size:14px}.item .meta{font-size:12px;color:#666;margin-top:2px}
.pop b{font-size:15px}.pop div{font-size:13px;margin-top:3px}.pop .note{color:#b35c00;font-size:12px}
.pop a{color:#0b62c4}
.lbl{background:none;border:none;box-shadow:none;font-size:10px;font-weight:700;color:#222;text-shadow:0 0 3px #fff,0 0 3px #fff}
.lbl:before{display:none}
.legend{background:#fff;padding:8px 10px;border-radius:6px;box-shadow:0 1px 4px rgba(0,0,0,.2);font-size:12px;line-height:1.7}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
.hlbox summary{font-size:14px;font-weight:700;cursor:pointer;color:#b35c00}
.hlbox textarea{width:100%;margin-top:6px;padding:8px 10px;border:1px solid #ccc;border-radius:6px;font-size:14px;font-family:inherit;resize:vertical;min-height:54px}
.btns{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.btn{border:1px solid #1f2328;background:#1f2328;color:#fff;border-radius:6px;padding:6px 12px;font-size:13px;cursor:pointer}
.btn.ghost{background:#fff;color:#1f2328}
#hlmsg{font-size:12px;margin-top:6px;line-height:1.6}#hlmsg .miss{color:#c0392b}#hlmsg .ok{color:#1a7f37}
.hlpin{background:none;border:none}
.hlpin .n{position:absolute;left:0;top:0;width:28px;height:28px;border-radius:50%;background:#ffd400;border:3px solid #1f2328;color:#1f2328;font:700 13px/22px sans-serif;text-align:center;box-shadow:0 2px 6px rgba(0,0,0,.4)}
.hlpin .r{position:absolute;left:-10px;top:-10px;width:48px;height:48px;border-radius:50%;border:4px solid #ffb000;animation:pulse 1.4s ease-out infinite}
@keyframes pulse{0%{transform:scale(.5);opacity:1}100%{transform:scale(1.5);opacity:0}}
.item.hl{background:#fff7cc}.item .num{flex:none;width:22px;height:22px;border-radius:50%;background:#ffd400;border:2px solid #1f2328;font:700 11px/18px sans-serif;text-align:center}
.clrall{display:none;background:#c0392b;color:#fff;border:2px solid #fff;border-radius:999px;padding:5px 11px;font-size:12px;font-weight:700;box-shadow:0 2px 6px rgba(0,0,0,.35);cursor:pointer}
.clrall.show{display:block}
.pop .veh{color:#6a3d00;font-weight:700}
@media(max-width:760px){#app{flex-direction:column-reverse}#side{width:100%;height:45%;overflow:auto}#list{flex:none;overflow:visible}#map{height:55%}}
</style></head><body>

  ${d.approx?'<div class="note">※ 地圖位置為約略位置</div>':''}

 d.m.bindTooltip(d.code,{permanent:true,direction:'right',offset:[6,0],className:'lbl'});
 d.m.closeTooltip();
});
function chip(el,label,set,val,color){const c=document.createElement('span');c.className='chip on';c.innerHTML=(color?`<span class="dot" style="background:${color}"></span>`:'')+label;
 c.onclick=()=>{set.has(val)?set.delete(val):set.add(val);c.classList.toggle('on');render()};el.appendChild(c)}
types.forEach(t=>chip(document.getElementById('types'),t,st.types,t,COLOR[t]));
regions.forEach(r=>chip(document.getElementById('regions'),r,st.regions,r));
document.getElementById('q').oninput=e=>{st.q=e.target.value.trim().toLowerCase();render()};
document.getElementById('lbl').onchange=render;
const layer=L.layerGroup().addTo(map);
function render(){
 layer.clearLayers();const list=document.getElementById('list');list.innerHTML='';const showL=document.getElementById('lbl').checked;
 const hlOn=HL.length>0,only=hlOn&&document.getElementById('hlonly').checked;
 let vis=DATA.filter(d=>st.types.has(d.type)&&st.regions.has(d.region)&&(!st.q||[d.name,d.code,d.alias||'',d.tel,d.addr].join(' ').toLowerCase().includes(st.q)));
 if(only)vis=vis.filter(d=>d.hn);
 if(hlOn)vis=[...vis.filter(d=>d.hn).sort((a,b)=>a.hn-b.hn),...vis.filter(d=>!d.hn)];
 vis.forEach(d=>{layer.addLayer(d.m);showL?d.m.openTooltip():d.m.closeTooltip();
  d.m.setStyle({fillOpacity:hlOn&&!d.hn?.3:.9,opacity:hlOn&&!d.hn?.4:1});
  const it=document.createElement('div');it.className='item'+(d.hn?' hl':'');
  it.innerHTML=(d.hn?`<span class="num">${d.hn}</span>`:`<span class="dot" style="background:${COLOR[d.type]}"></span>`)+`<div><b>${d.name}</b> <span class="meta">${d.code}${d.alias?'/'+d.alias:''}</span><div class="meta">${d.region}・${d.tel}${d.addr?'・'+d.addr:''}</div></div>`;
  it.onclick=()=>{map.setView([d.plat,d.plng],16);d.m.openPopup()};list.appendChild(it)});
 document.getElementById('count').textContent=`顯示 ${vis.length} / ${DATA.length} 個地點`;
}
// ===== 標記多個地點 =====
let HL=[];let VEH={};const hlLayer=L.layerGroup().addTo(map);
const norm=t=>t.toLowerCase().replace(/\s/g,'');
function doHL(text,fit){
 DATA.forEach(d=>d.hn=0);HL=[];hlLayer.clearLayers();
 const toks=[...new Set(text.split(/[\s,，、;；\/|]+/).map(t=>t.trim()).filter(Boolean))];
 const miss=[];let n=0;
 toks.forEach(t=>{const k=norm(t);
  let hit=DATA.filter(d=>d.code.toLowerCase()===k||(d.alias||'').toLowerCase()===k);
  if(!hit.length)hit=DATA.filter(d=>norm(d.name)===k);
  if(!hit.length)hit=DATA.filter(d=>norm(d.name).includes(k));
  if(!hit.length){miss.push(t);return}
  hit.forEach(d=>{if(!d.hn){d.hn=++n;HL.push(d)}})});
 HL.forEach(d=>{const mk=L.marker([d.plat,d.plng],{zIndexOffset:1000,icon:L.divIcon({className:'hlpin',html:'<div class="r"></div><div class="n">'+d.hn+'</div>',iconSize:[28,28],iconAnchor:[14,14],popupAnchor:[0,-14]})}).bindPopup(d.pop);hlLayer.addLayer(mk)});
 HL.forEach(d=>{const v=VEH[d.code]||VEH[d.alias];const html=v&&v.length?d.pop.replace('</div></div>',`</div><div class="veh">圖片車輛（讀圖結果，僅供參考）：${v.join('、')}</div></div>`):d.pop;hlLayer.getLayers().forEach(m=>{});d._hpop=html});
 hlLayer.getLayers().forEach((m,i)=>m.setPopupContent(HL[i]._hpop));
 const msg=document.getElementById('hlmsg');
 msg.innerHTML=(toks.length?`<div class="ok">已標記 ${HL.length} 個地點</div>`:'')+(miss.length?`<div class="miss">搵唔到：${miss.join('、')}</div>`:'');
 if(fit&&HL.length){HL.length===1?map.setView([HL[0].plat,HL[0].plng],15):map.fitBounds(L.latLngBounds(HL.map(d=>[d.plat,d.plng])),{padding:[40,40],maxZoom:15})}
 history.replaceState(null,'',toks.length?'#hl='+encodeURIComponent(toks.join(',')):location.pathname+location.search);
 document.getElementById('clrall')&&document.getElementById('clrall').classList.toggle('show',HL.length>0);
 render();
}
document.getElementById('hlgo').onclick=()=>doHL(document.getElementById('hlq').value,true);
document.getElementById('hlq').addEventListener('keydown',e=>{if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)){e.preventDefault();doHL(e.target.value,true)}});
const clearAll=()=>{document.getElementById('hlq').value='';VEH={};document.getElementById('ocrmsg').textContent='';doHL('',false)};
document.getElementById('hlclr').onclick=clearAll;
const clrCtl=L.control({position:'bottomleft'});
clrCtl.onAdd=()=>{const b=L.DomUtil.create('button','clrall');b.id='clrall';b.textContent='✖ 清除標記';L.DomEvent.disableClickPropagation(b);b.onclick=clearAll;return b};
clrCtl.addTo(map);
document.getElementById('hlonly').onchange=render;
document.getElementById('hlshare').onclick=()=>{const u=location.href;(navigator.clipboard?navigator.clipboard.writeText(u):Promise.reject()).then(()=>alert('已複製連結，可以貼去 WhatsApp'),()=>prompt('複製呢條連結：',u))};
// ===== 上載圖片 → 自動讀取站編號 =====
const CODES=new Set(DATA.flatMap(d=>d.alias?[d.code,d.alias]:[d.code]));
async function loadImg(file){try{return await createImageBitmap(file)}catch(e){return await new Promise((ok,no)=>{const u=URL.createObjectURL(file),im=new Image();im.onload=()=>ok(im);im.onerror=()=>no(new Error('呢個圖片格式讀唔到，請用 JPG 或 PNG（可以截圖再上載）'));im.src=u})}}
async function prep(file){const img=await loadImg(file);const sc=Math.max(1,Math.min(3,1050/img.width));
 const c=document.createElement('canvas');c.width=img.width*sc;c.height=img.height*sc;const g=c.getContext('2d');g.imageSmoothingQuality='high';g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);g.drawImage(img,0,0,c.width,c.height);return c}
const isVeh=t=>/^[AF](?=.*\d)[0-9A-Z]{2,4}$/.test(t);
document.getElementById('hlimg').onchange=async e=>{
 const f=e.target.files[0];e.target.value='';if(!f)return;const om=document.getElementById('ocrmsg');
 if(!window.Tesseract){om.textContent='圖片讀取工具載入失敗，請檢查網絡後重試';return}
 om.textContent='讀取圖片中…（第一次用要下載讀字工具，約 10–20 秒）';
 try{const cv=await prep(f);
  const w=await Tesseract.createWorker('eng',1,{logger:m=>{if(m.status==='recognizing text')om.textContent='讀取圖片中…（'+(window._lab||'')+'）'+Math.round(m.progress*100)+'%'}});
  const found=[],u11=new Set(),t4=new Set();VEH={};
  const addV=(c,v)=>{if(v){VEH[c]=VEH[c]||[];if(!VEH[c].includes(v))VEH[c].push(v)}};
  const tk=l=>l.toUpperCase().split(/[^A-Z0-9]+/).filter(Boolean);
  for(const [ps,lab] of [['11','1/2'],['4','2/2']]){
   window._lab=lab;
   await w.setParameters({tessedit_pageseg_mode:ps});
   const {data}=await w.recognize(cv);
   (ps==='11'?[data.text.replace(/\n+/g,' ')]:data.text.split('\n')).forEach(line=>{const t=tk(line);
    t.forEach((x,i)=>{const v=isVeh(t[i+1]||'')?t[i+1]:null;
     if(CODES.has(x)){if(!found.includes(x))found.push(x);addV(x,v)}
     else if(ps==='11'&&/^[A-Z]{3}$/.test(x)&&v)u11.add(x);
     if(ps==='4')t4.add(x)})});
  }
  await w.terminate();
  const unk=[...u11].filter(x=>t4.has(x));
  // 同一編號有消防局同救護站：車輛 A 開頭 → 救護站，F 開頭 → 消防局
  const toks=found.map(c=>{const ds=DATA.filter(d=>d.code===c||d.alias===c);const v=VEH[c]||[];
   if(ds.length>1&&v.length){const want=new Set(v.map(x=>x[0]==='A'?'救護站':'消防局'));const pick=ds.filter(d=>want.has(d.type));if(pick.length&&pick.length<ds.length)return pick.map(d=>d.name).join(' ')}
   return c});
  if(!found.length){om.textContent='圖片入面搵唔到站編號，可以試吓影清楚啲或者手動輸入';return}
  document.getElementById('hlq').value=toks.join(' ');
  om.innerHTML=`<span style="color:#1a7f37">圖片讀到 ${found.length} 個站編號</span>`+(unk.length?`<br><span style="color:#c0392b">圖片有但地圖冇呢啲編號：${unk.join('、')}</span>`:'')+'<br>請核對上面輸入框，如有錯漏可以直接改，再撳「標記」';
  doHL(toks.join(' '),true);
 }catch(err){console.error(err);om.textContent='讀取失敗：'+err.message}
};
render();
const mh=location.hash.match(/^#hl=(.+)$/);
if(mh){const t=decodeURIComponent(mh[1]).replace(/,/g,' ');document.getElementById('hlq').value=t;document.getElementById('hlbox').open=true;doHL(t,true)}
</script></body></html>
